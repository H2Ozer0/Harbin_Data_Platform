server:
  port: 8082
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://101.35.234.65:5432/postgres
    username: osmuser
    password: pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 15000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss

app:
  taxi:
    mock-enabled: false
    data-start-date: 2015-01-03T00:00:00
    data-end-date: 2015-01-07T23:59:59
    min-lon: 126.0
    max-lon: 127.2
    min-lat: 45.4
    max-lat: 46.2
